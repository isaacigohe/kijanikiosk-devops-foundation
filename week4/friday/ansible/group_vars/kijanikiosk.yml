ssh_key_name: id_rsa
ansible_user: ubuntu
ansible_ssh_private_key_file: "~/.ssh/{{ ssh_key_name }}"
base_dir: /opt/kijanikiosk
log_dir: /var/log/kijanikiosk
packages:
  - ufw
  - logrotate
  - curl
log_level: info
ufw_ports: "{{ [22, service_port] }}"
journal_max_use: 200M
log_rotate_days: 14
dns_servers: "8.8.8.8 1.1.1.1"
